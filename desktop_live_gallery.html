<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desktop Live Wallpaper Gallery</title>
  <style>
    :root {
      --primary: #0066ff;
      --primary-hover: #0052cc;
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #212529;
      --muted: #6c757d;
      --border: #e9ecef;
    }

    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .gallery-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 25px;
      text-align: center;
    }

    header h1 {
      margin-bottom: 8px;
    }

    .gallery-controls {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 25px;
    }

    .search-input {
      width: 100%;
      padding: 12px 18px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .gallery-tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: #e9ecef;
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      color: var(--muted);
      transition: all 0.2s;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--primary);
      color: #ffffff;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .wallpaper-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px rgba(0,0,0,0.03);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .wallpaper-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 12px rgba(0,0,0,0.08);
    }

    .card-preview {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background-color: #000;
    }

    .card-body {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .card-meta {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .card-meta a {
      color: var(--primary);
      text-decoration: none;
    }

    .download-btn {
      display: block;
      text-align: center;
      background: var(--primary);
      color: #ffffff;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.2s;
    }

    .download-btn:hover {
      background: var(--primary-hover);
    }

    .status-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: var(--muted);
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div class="gallery-container">
    <header>
      <h1>Video Wallpaper Gallery</h1>
      <p>Browse free desktop live wallpapers for Desktop Live Wallpaper+</p>
    </header>

    <div class="gallery-controls">
      <input type="text" id="search-bar" class="search-input" placeholder="Search by keyword, author, or category..." autocomplete="off">
      <div id="category-tabs" class="gallery-tabs"></div>
    </div>

    <div id="gallery-grid" class="gallery-grid">
      <div class="status-msg">Loading catalog...</div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const tabsContainer = document.getElementById("category-tabs");
      const gridContainer = document.getElementById("gallery-grid");
      const searchInput = document.getElementById("search-bar");

      let wallpaperData = {};
      let allWallpapers = [];
      let currentCategory = "all";

      try {
        // Fetches wallpapers_cache.json generated by GitHub Actions
        const response = await fetch("wallpapers_cache.json");
        if (!response.ok) throw new Error("Could not find or fetch wallpapers_cache.json");
        wallpaperData = await response.json();

        // Build flat array for global search
        Object.keys(wallpaperData).forEach(cat => {
          allWallpapers = allWallpapers.concat(wallpaperData[cat]);
        });
      } catch (error) {
        gridContainer.innerHTML = `<div class="status-msg" style="color: #dc3545;">Error: ${error.message}</div>`;
        return;
      }

      function renderGrid(items) {
        gridContainer.innerHTML = "";

        if (items.length === 0) {
          gridContainer.innerHTML = `<div class="status-msg">No wallpapers found matching your query.</div>`;
          return;
        }

        items.forEach(item => {
          const card = document.createElement("div");
          card.className = "wallpaper-card";

          card.innerHTML = `
            <video class="card-preview" muted loop onmouseover="this.play()" onmouseout="this.pause(); this.currentTime=0;">
              <source src="${item.video_url || ''}" type="video/mp4">
            </video>
            <div class="card-body">
              <div class="card-meta">
                <span>Category: <strong>${item.category || 'General'}</strong></span><br>
                <span>Author: <a href="https://pixabay.com/users/${item.author_id}/" target="_blank" rel="noopener">${item.author}</a></span>
              </div>
              <a href="${item.pixabay_url}" target="_blank" rel="noopener noreferrer" class="download-btn">
                Download on Pixabay
              </a>
            </div>
          `;
          gridContainer.appendChild(card);
        });
      }

      function applyFilters() {
        const query = searchInput.value.toLowerCase().trim();

        let filtered = (currentCategory === "all") 
          ? allWallpapers 
          : (wallpaperData[currentCategory] || []);

        if (query.length > 0) {
          filtered = filtered.filter(item => {
            const authorMatch = item.author ? item.author.toLowerCase().includes(query) : false;
            const categoryMatch = item.category ? item.category.toLowerCase().includes(query) : false;
            const urlMatch = item.pixabay_url ? item.pixabay_url.toLowerCase().includes(query) : false;
            return authorMatch || categoryMatch || urlMatch;
          });
        }

        renderGrid(filtered);
      }

      // Populate Tabs
      const categories = ["all", ...Object.keys(wallpaperData)];
      categories.forEach((cat, index) => {
        const btn = document.createElement("button");
        btn.className = `tab-btn ${index === 0 ? "active" : ""}`;
        btn.textContent = cat.charAt(0).toUpperCase() + cat.slice(1);

        btn.addEventListener("click", () => {
          document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          currentCategory = cat;
          applyFilters();
        });

        tabsContainer.appendChild(btn);
      });

      searchInput.addEventListener("input", applyFilters);
      applyFilters(); // Initial render
    });
  </script>
</body>
</html>
