<!DOCTYPE html>
<html>
<head>
  <title>Talking Head - minimal example</title>

  <style>
    body, html { width:100%; height:100%; max-width: 800px; margin: auto; position: relative; background-color: #202020; color: white; }
    #avatar { display: block; width:100%; height:100%; }
    #controls { display: block; position: absolute; top: 10px; left: 10px; right: 10px; height: 50px; }
    #text { position: absolute; width: Calc( 100% - 110px ); height: 100%; top: 0; left: 0; bottom: 0; right: 110px; font-family: Arial; font-size: 20px; }
    #speak { display: block; position: absolute; top: 0; bottom: 0; right: 0; height: 100%; width: 100px; font-family: Arial; font-size: 20px; }
    #loading { display: block; position: absolute; bottom: 10px; left: 10px; right: 10px; height: 50px; font-family: Arial; font-size: 20px; }
  </style>

  <script type="importmap">
  { "imports":
    {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.7/modules/talkinghead.mjs"
    }
  }
  </script>

  <script type="module">
    import { TalkingHead } from "talkinghead";

    let head;

    document.addEventListener('DOMContentLoaded', async function(e) {

      // Instantiate the class
      // NOTE: Never put your API key in a client-side code unless you know
      //       that you are the only one to have access to that code!
      const nodeAvatar = document.getElementById('avatar');
      head = new TalkingHead( nodeAvatar, {
        ttsEndpoint: "https://eu-texttospeech.googleapis.com/v1beta1/text:synthesize",
        ttsApikey: "put-your-own-Google-TTS-API-key-here", // <- Change this
        lipsyncModules: ["en", "fi"],
        cameraView: "upper"
      });

      // Load and show the avatar
      const nodeLoading = document.getElementById('loading');
      try {
        nodeLoading.textContent = "Loading...";
        await head.showAvatar( {
          url: 'https://models.readyplayer.me/64bfa15f0e72c63d7c3934a6.glb?morphTargets=ARKit,Oculus+Visemes,mouthOpen,mouthSmile,eyesClosed,eyesLookUp,eyesLookDown&textureSizeLimit=1024&textureFormat=png',
          body: 'F',
          avatarMood: 'neutral',
          ttsLang: "en-GB",
          ttsVoice: "en-GB-Standard-A",
          lipsyncLang: 'en'
        }, (ev) => {
          if ( ev.lengthComputable ) {
            let val = Math.min(100,Math.round(ev.loaded/ev.total * 100 ));
            nodeLoading.textContent = "Loading " + val + "%";
          }
        });
        nodeLoading.style.display = 'none';
      } catch (error) {
        console.log(error);
        nodeLoading.textContent = error.toString();
      }

      // Speak when clicked
      const nodeSpeak = document.getElementById('speak');
      nodeSpeak.addEventListener('click', function () {
        try {
          const text = document.getElementById('text').value;
          if ( text ) {
            head.speakText( text );
          }
        } catch (error) {
          console.log(error);
        }
      });

      // Pause animation when document is not visible
      document.addEventListener("visibilitychange", async function (ev) {
        if (document.visibilityState === "visible") {
          head.start();
        } else {
          head.stop();
        }
      });

    });

  </script>

  <!-- ======================================================================= -->
  <!-- 2. CSS STYLING: TRANSITIONS, DOCK PHYSICS, AND BLUR ANIMATION          -->
  <!-- ======================================================================= -->
  <style>
    /* THE GHOST ANCHOR: Stays fixed in layout to completely eliminate infinite layout flickers */
    .outstream-placement-anchor {
      width: 336px;
      height: 280px;
      margin: 40px auto;
      position: relative;
      background: transparent;
    }

    /* THE MOVING CONTAINER: Holds the ad frame and performs transitions on scroll */
    .outstream-main-container {
      width: 336px;
      height: 280px;
      background: #fbfbfb;
      position: absolute;
      top: 0;
      left: 0;
      transition: box-shadow 0.3s ease;
    }

    /* STICKY OVERLAY STATE: Engaged programmatically by IntersectionObserver */
    .outstream-main-container.is-sticky {
      position: fixed;
      top: auto;
      left: auto;
      bottom: 25px;
      right: 25px;
      z-index: 99999;
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      
      /* Downscale slightly for clean desktop corner placement */
      transform: scale(0.9);
      transform-origin: bottom right;
      
      /* Premium entrance physics: slides up, clears blur layer, fades visibility */
      animation: dynamicStickyShow 0.45s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    /* Keeps iframe elements isolated and clipped safely inside borders when sticky */
    .outstream-main-container.is-sticky #div-gpt-ad-outstream-slot {
      border-radius: 4px;
      overflow: hidden;
    }

    /* CLOSE TRIGGER MARKUP: Revealed exclusively during sticky activation mode */
    .outstream-close-trigger {
      display: none;
      position: absolute;
      top: -12px;
      left: -12px;
      width: 26px;
      height: 26px;
      background: #111;
      color: #fff;
      border-radius: 50%;
      text-align: center;
      line-height: 23px;
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-size: 15px;
      font-weight: bold;
      border: 2px solid #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      z-index: 100000;
      transition: background 0.2s ease;
    }

    .outstream-close-trigger:hover {
      background: #ff3b30; /* Desktop specific feedback overlay shift */
    }

    .outstream-main-container.is-sticky .outstream-close-trigger {
      display: block;
    }

    /* BLUR ENTRANCE KEYFRAME SEQUENCING */
    @keyframes dynamicStickyShow {
      0% {
        transform: translateY(60px) scale(0.85);
        opacity: 0;
        filter: blur(8px);
      }
      100% {
        transform: translateY(0) scale(0.9);
        opacity: 1;
        filter: blur(0);
      }
    }
  </style>
  
  </head>
 

<body>
  <div id="avatar"></div>
  <div id="controls">
    <input id="text" type="text" value="Hi there. How are you? I'm fine.">
    <input id="speak" type="button" value="Speak">
  </div>
  <div id="loading"></div>
