name: Update Pixabay Wallpaper Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    
    # 1. Define the secret at the JOB level so it is globally available to steps
    env:
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Pixabay Catalog Generator Script
        run: python scripts/update_pixabay_wallpapers.py

      - name: Commit and push wallpapers_cache.json if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add wallpapers_cache.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Pixabay wallpaper catalog [skip ci]" && git push)