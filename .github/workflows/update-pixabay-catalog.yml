name: Update Pixabay Wallpaper Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # Runs daily at 02:00 UTC

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Pixabay Fetcher Script
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python scripts/update_pixabay_wallpapers.py

      - name: Commit and push changes if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add wallpapers_cache.json
          
          # Check if changes exist, then commit & push
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Pixabay wallpaper catalog [skip ci]" && git push)